name: Build & Deploy Next.js to Huawei OBS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Global environment
env:
  ACCESS_KEY: ${{ secrets.HUAWEI_ACCESS_KEY }}
  SECRET_KEY: ${{ secrets.HUAWEI_SECRET_KEY }}
  REGION: ${{ secrets.HUAWEI_REGION }}
  BUCKET_NAME: ${{ secrets.HUAWEI_BUCKET }}
  LOCAL_PATH: ./out/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: |
          # Ensure Next.js export directory exists
          npm run build
          npm run export   # generates ./out by default

      - name: Debug out folder
        run: ls -la $LOCAL_PATH

      - name: Install obsutil and Sync to OBS
        run: |
          # Download obsutil
          wget https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzvf obsutil_linux_amd64.tar.gz

          # Find extracted directory
          OBS_DIR=$(ls -d obsutil_linux_amd64_*)
          chmod -R 755 $OBS_DIR

          # Configure obsutil
          ./$OBS_DIR/obsutil config \
            -i=$ACCESS_KEY \
            -k=$SECRET_KEY \
            -e=obs.$REGION.myhuaweicloud.com

          # Sync the exported static site
          ./$OBS_DIR/obsutil sync \
            $LOCAL_PATH \
            obs://$BUCKET_NAME/
